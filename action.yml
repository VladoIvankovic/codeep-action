name: "Codeep Review"
description: "Run the Codeep offline reviewer on a pull request's changed files; post a sticky comment and inline annotations."
author: "VladoIvankovic"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  codeep-version:
    description: "npm version or dist-tag of the codeep package to run (e.g. 'latest', '2.5.0'). Pin for reproducible reviews."
    required: false
    default: "latest"
  fail-on:
    description: "Severity threshold that fails the check: error | warning | info | none. 'none' never fails (informational mode)."
    required: false
    default: "error"
  comment:
    description: "Post/update a sticky summary comment on the PR ('true' | 'false')."
    required: false
    default: "true"
  annotate:
    description: "Emit inline GitHub annotations (error/warning/notice) for each issue ('true' | 'false')."
    required: false
    default: "true"
  files:
    description: "Optional space-separated list of files to review, overriding PR-derived changed files. Leave empty for normal PR use."
    required: false
    default: ""
  max-annotations:
    description: "Maximum number of inline annotations to emit."
    required: false
    default: "50"
  max-issues-per-file:
    description: "Maximum issues to list per file in the comment before collapsing to '...and N more'."
    required: false
    default: "10"
  fix:
    description: >
      After reviewing, let an agent fix what was found and open a pull request
      with the result. Never pushes to the branch under review, and never
      merges. Requires `contents: write` and `pull-requests: write`, an API key
      for your provider in the environment, and is skipped on pull requests
      from forks (their token cannot push). 'true' | 'false'.
    required: false
    default: "false"
  fix-min-severity:
    description: >
      Lowest severity a fix may act on: error | warning (default: warning).
      Suggestions are never eligible — acting on opinion produces churn and
      buries the findings that matter.
    required: false
    default: "warning"
  fix-branch-prefix:
    description: "Branch prefix for fix pull requests. The PR number is appended."
    required: false
    default: "codeep/fix"
  github-token:
    description: "Token used to read PR files and post the comment. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  dashboard-token:
    description: "Optional scoped Codeep CI token (mint one in the dashboard). When set, a compact per-PR review summary (counts + hotspot files, no source) is posted for team analytics. Leave empty to disable. Pass it from a repository secret; see the README. The braces are left out of this sentence on purpose — GitHub evaluates expressions inside input descriptions, and `secrets` is not a context an action manifest may use, so writing one here stops the whole manifest from loading."
    required: false
    default: ""
  dashboard-url:
    description: "Base URL of the Codeep dashboard that receives analytics. Override only for self-hosted deployments."
    required: false
    default: "https://codeep.dev"

outputs:
  score:
    description: "Overall Codeep score (0-100). Empty string when the review was skipped."
    value: ${{ steps.review.outputs.score }}
  total-issues:
    description: "Total number of issues found ('0' when skipped or clean)."
    value: ${{ steps.review.outputs.total-issues }}
  fix-pr:
    description: "URL of the pull request opened with fixes, or empty when none was."
    value: ${{ steps.review.outputs.fix-pr }}
  exit-code:
    description: "Exit code from `codeep review` (0 = passed threshold, 1 = tripped). '0' when skipped."
    value: ${{ steps.review.outputs.exit-code }}
  skipped:
    description: "'true' when no review ran (not a PR context, or no reviewable changed files)."
    value: ${{ steps.review.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"

    - name: Run Codeep review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_CODEEP_VERSION: ${{ inputs.codeep-version }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_ANNOTATE: ${{ inputs.annotate }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        INPUT_MAX_ISSUES_PER_FILE: ${{ inputs.max-issues-per-file }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_FIX_MIN_SEVERITY: ${{ inputs.fix-min-severity }}
        INPUT_FIX_BRANCH_PREFIX: ${{ inputs.fix-branch-prefix }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_DASHBOARD_TOKEN: ${{ inputs.dashboard-token }}
        INPUT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/review.mjs"
