name: Move major tag

# Keeps the floating major tag (v1) pointing at the latest v1.x.y release,
# honoring the README's "patch/minor updates land on the v1 tag" promise.
# Runs on every full-version tag push; also manually dispatchable to repair
# a stale major tag (pass the target version, e.g. "v1.0.3").

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Full version tag the major tag should point at (e.g. v1.0.3)"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move the major tag
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Guard: only act on clean vX.Y.Z (no prerelease suffixes — a
          # v2.0.0-beta must never move a floating tag).
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::'$VERSION' is not a clean release tag; skipping."
            exit 0
          fi
          MAJOR="${VERSION%%.*}"   # v1.0.3 -> v1
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION does not exist."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa "$MAJOR" "$VERSION^{}" -m "Point $MAJOR at $VERSION"
          git push origin "$MAJOR" --force
          echo "::notice::$MAJOR now points at $VERSION."
