name: Codeep Review (self)

# Dogfood: run this action on its own pull requests.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# contents: write lets the fix step push its own branch. It never pushes to the
# branch under review — see openFixPullRequest in scripts/review.mjs.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codeep-self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Codeep Review
        uses: ./
        with:
          fail-on: warning
          fix: true
        # Reviewing needs no key — it is deterministic and offline. Only the fix
        # agent runs a model. Every provider Codeep supports is listed; a secret
        # that does not exist expands to an empty string, which the action
        # ignores, so setting any single one of these is enough.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
